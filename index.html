<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo JAV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- Configuración Base y Reseteos --- */
        body {
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Módulo de Descripciones Dinámicas (Ver más / Ocultar en la misma línea) --- */
        .descripcion-video {
            word-wrap: break-word;
            white-space: normal;
        }

        .contenedor-descripcion {
            position: relative;
            max-height: 4.5em; /* 3 líneas exactas basadas en el line-height */
            line-height: 1.5em;
            overflow: hidden;
        }

        /* Remueve el límite de altura cuando se expande el contenedor */
        .contenedor-descripcion.expandido {
            max-height: none;
        }

        /* Genera un bloque invisible que empuja al botón flotante hacia la tercera línea */
        .contenedor-descripcion::before {
            content: "";
            float: left;
            height: calc(4.5em - 14px); /* Altura de 3 líneas menos la altura del botón */
            width: 0;
        }

        /* Alinea el botón a la derecha al final de la tercera línea interfiriendo con el flujo del texto */
        .btn-inline {
            float: right;
            clear: right;
            position: relative;
            height: 14px;
            line-height: 14px;
            padding-left: 16px;
            /* Degradado suave para ocultar letras que queden inmediatamente detrás de la acción */
            background: linear-gradient(to left, #030712 75%, transparent);
        }

        /* --- Componente Marquee Animado --- */
        @keyframes marquee-lineal {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        
        .contenedor-marquee {
            display: flex;
            width: max-content;
            animation: marquee-lineal 40s linear infinite;
        }
        
        .bloque-frases {
            display: flex;
            white-space: nowrap;
        }
        
        .frase-item {
            padding-right: 120px; 
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased select-none">

    <header class="sticky top-0 z-50 bg-gray-950 border-b border-gray-800 shadow-md px-4 pt-3 pb-2">
        <div class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-3xl font-black tracking-tighter text-red-500 m-0 leading-none">JAV</h1>
                <p class="text-[9px] text-gray-400 font-bold uppercase tracking-wider mt-1">Videos para adultos producidos en Japón</p>
            </div>
            <button id="btn-inicio" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black px-3 py-2 rounded shadow transition-all active:scale-95">
                INICIO
            </button>
        </div>

        <div class="w-full bg-red-950/40 border-y border-red-900/30 py-1 mb-2 overflow-hidden rounded">
            <div class="contenedor-marquee text-[10px] font-black text-red-400 tracking-wide uppercase">
                <div class="bloque-frases">
                    <span class="frase-item">🔥 ¡Todo el contenido se puede ver en línea y descargar de forma directa! 🔥</span>
                    <span class="frase-item">🔥 ¡Solicita tu acceso al whatsapp 983072104! 🔥</span>
                </div>
                <div class="bloque-frases">
                    <span class="frase-item">🔥 ¡Todo el contenido se puede ver en línea y descargar de forma directa! 🔥</span>
                    <span class="frase-item">🔥 ¡Solicita tu acceso al whatsapp 983072104! 🔥</span>
                </div>
            </div>
        </div>

        <div id="zona-filtros-busqueda"></div>
    </header>

    <main class="p-4 min-h-[calc(100vh-140px)]">
        <div id="contenedor-principal" class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
        <div id="contenedor-paginacion" class="flex justify-center items-center gap-1.5 mt-6 pb-8"></div>
    </main>

    <datalist id="lista-actrices"></datalist>

    <script src="app.js"></script>
</body>
</html>
